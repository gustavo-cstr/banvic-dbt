models:
  - name: stg_erp__colaboradores
    description: Staging de colaboradores com tipagens corretas, limpeza de documentos e colunas renomeadas.
    columns:
      - name: pk_colaborador
        description: Chave primária do colaborador.
        data_tests:
          - unique
          - not_null
      - name: fk_localidade
        description: Chave estrangeira para a tabela de localidades.
      - name: fk_gerente
        description: Chave estrangeira para o gerente do colaborador (auto-referência na tabela de colaboradores).
      - name: nome_colaborador
        description: Nome completo do colaborador (primeiro nome + último nome).
      - name: email_colaborador
        description: Endereço de e-mail do colaborador.
      - name: cpf_colaborador
        description: CPF do colaborador sem pontuação.
      - name: dt_nascimento_colaborador
        description: Data de nascimento do colaborador.
      - name: endereco_colaborador
        description: Endereço completo do colaborador.
      - name: cep_colaborador
        description: CEP do colaborador sem pontuação.
